<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Tools Directory</title>
<meta name="description" content="Hand-picked AI tools for studying, writing, design, video, careers and coding. Free options are marked.">
<script>
try { var s = localStorage.getItem("theme");
  document.documentElement.setAttribute("data-theme", s || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
} catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F4EEFF; --card:#fff; --ink:#14110F; --muted:#5B5566; --line:#14110F; --shadow:#14110F; --mark:#FFD93D; --pink:#FF6FB5; --dot:rgba(20,17,15,.13); }
  [data-theme="dark"] { --bg:#15121C; --card:#211C2D; --ink:#F6F2FF; --muted:#B5ADC8; --line:#D9D2EA; --shadow:#6B5CA5; --dot:rgba(246,242,255,.09); }
  * { box-sizing: border-box; }
  body { margin:0; color:var(--ink); font:16px/1.5 'DM Sans', system-ui, sans-serif; background-color:var(--bg); background-image:radial-gradient(var(--dot) 1.3px, transparent 1.3px); background-size:22px 22px; transition:background-color .3s, color .3s; }
  .wrap { max-width:980px; margin:0 auto; padding:0 18px; }
  button:focus-visible, a:focus-visible, #search:focus-visible { outline:3px solid var(--pink); outline-offset:3px; }

  .top { background:var(--mark); color:#14110F; border-bottom:3px solid var(--line); }
  .top .wrap { position:relative; display:flex; align-items:center; padding-top:12px; padding-bottom:12px; }
  .logo { font:400 20px 'Archivo Black', Impact, sans-serif; letter-spacing:-.01em; }
  .logo i { display:inline-block; width:13px; height:13px; background:#14110F; transform:rotate(45deg); margin-right:11px; }
  .setbtn { margin-left:auto; font:700 14px 'DM Sans', sans-serif; padding:7px 14px; background:var(--card); color:var(--ink); border:2.5px solid var(--line); border-radius:10px; box-shadow:3px 3px 0 var(--shadow); cursor:pointer; }
  .setbtn:active { transform:translate(3px,3px); box-shadow:none; }
  .panel { position:absolute; right:18px; top:58px; z-index:30; min-width:236px; padding:6px 16px; background:var(--card); color:var(--ink); border:3px solid var(--line); border-radius:14px; box-shadow:6px 6px 0 var(--shadow); }
  .panel[hidden], .sug[hidden] { display:none; }
  .panel label { display:flex; align-items:center; gap:10px; padding:10px 0; font-weight:500; cursor:pointer; }
  .panel input { width:20px; height:20px; accent-color:#FF6FB5; }

  .ticker { overflow:hidden; white-space:nowrap; padding:9px 0; background:#14110F; color:var(--mark); border-bottom:3px solid var(--line); font:700 14px 'Space Mono', monospace; text-transform:uppercase; letter-spacing:.08em; }
  .track { display:inline-flex; animation:slide 30s linear infinite; }

  .hero { position:relative; z-index:5; padding:34px 0 30px; }
  .hero-in { position:relative; }
  .sticker { display:inline-block; margin-bottom:8px; padding:5px 12px; background:var(--mark); color:#14110F; border:3px solid var(--line); border-radius:10px; box-shadow:3px 3px 0 var(--shadow); font:700 13px 'Space Mono', monospace; text-transform:uppercase; animation:wiggle 3.5s ease-in-out infinite; }
  @media (min-width:780px) { .sticker { position:absolute; right:0; top:0; font-size:15px; } }
  h1 { font:400 clamp(38px,10.5vw,76px)/.98 'Archivo Black', Impact, sans-serif; letter-spacing:-.02em; margin:8px 0 16px; max-width:12em; }
  h1 mark { display:inline-block; padding:0 .12em; background:var(--pink); color:#14110F; border:3px solid var(--line); border-radius:8px; box-shadow:4px 4px 0 var(--shadow); transform:rotate(-2deg); }
  .lead { max-width:34em; margin:0 0 24px; font-size:17px; color:var(--muted); }
  .sbox { position:relative; }
  #search { width:100%; padding:16px 18px; font:500 17px 'DM Sans', sans-serif; background:#fff; color:#14110F; border:3px solid var(--line); border-radius:12px; box-shadow:6px 6px 0 var(--shadow); }
  #search:focus { box-shadow:6px 6px 0 var(--pink); }
  .sug { position:absolute; left:0; right:0; top:calc(100% + 16px); z-index:20; margin:0; padding:6px; list-style:none; max-height:340px; overflow:auto; background:var(--card); color:var(--ink); border:3px solid var(--line); border-radius:14px; box-shadow:6px 6px 0 var(--shadow); }
  .sug li { display:flex; align-items:center; gap:12px; padding:10px; border-radius:10px; cursor:pointer; }
  .sug li:hover, .sug li:active { background:var(--mark); color:#14110F; }
  .sug img { width:30px; height:30px; padding:3px; background:#fff; border:2px solid var(--line); border-radius:8px; object-fit:contain; }
  .sug b { font-weight:700; }
  .sug small { margin-left:auto; font:700 11px 'Space Mono', monospace; text-transform:uppercase; opacity:.7; }
  .sug .none { cursor:default; background:none; color:var(--muted); }
  .tasks { display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }
  .tasks button { font:700 14px 'DM Sans', sans-serif; padding:8px 14px; background:var(--card); color:var(--ink); border:2.5px solid var(--line); border-radius:10px; box-shadow:3px 3px 0 var(--shadow); cursor:pointer; transition:transform .12s, box-shadow .12s, background .12s; }
  .tasks button:hover { background:var(--mark); color:#14110F; transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--shadow); }
  .tasks button:active { transform:translate(3px,3px); box-shadow:none; }

  .filters { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:14px 0 10px; }
  .cat { --c:#3DDC97; display:inline-flex; align-items:center; gap:7px; font:700 14px 'DM Sans', sans-serif; padding:7px 14px; background:var(--card); color:var(--ink); border:2.5px solid var(--line); border-radius:999px; box-shadow:3px 3px 0 var(--shadow); cursor:pointer; transition:transform .12s, box-shadow .12s; }
  .cat i { width:10px; height:10px; border-radius:50%; background:var(--c); border:2px solid var(--line); }
  .cat:hover { transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--shadow); }
  .cat[aria-pressed="true"] { background:var(--c); color:#14110F; transform:translate(3px,3px); box-shadow:none; }
  .cat[aria-pressed="true"] i { background:#fff; border-color:#14110F; }
  .cat.free { --c:#FFD93D; }
  .count { margin:8px 0 18px; font:700 14px 'Space Mono', monospace; text-transform:uppercase; letter-spacing:.06em; }

  .grid { list-style:none; margin:0; padding:0 6px 14px 0; display:grid; grid-template-columns:repeat(auto-fill, minmax(290px, 1fr)); gap:22px; }
  .card { --sh:var(--shadow); display:flex; flex-direction:column; gap:10px; padding:18px; border:3px solid var(--line); border-radius:16px; box-shadow:6px 6px 0 var(--sh);
          background-color:var(--card); background-image:linear-gradient(var(--t), var(--t));
          animation:rise .5s both; animation-delay:calc(var(--i) * 45ms); transition:transform .15s, box-shadow .15s; }
  [data-theme="dark"] .card { --sh:var(--c); }
  .card:active { transform:translate(4px,4px); box-shadow:2px 2px 0 var(--sh); }
  @media (hover:hover) {
    .card:hover { transform:translate(-3px,-3px); box-shadow:10px 10px 0 var(--sh); }
    .card:hover .av { transform:rotate(-8deg) scale(1.08); }
  }
  .head { display:flex; align-items:center; gap:12px; }
  .av { flex:none; width:54px; height:54px; display:grid; place-items:center; background:#fff; border:3px solid var(--line); border-radius:14px; color:#14110F; font:400 22px 'Archivo Black', Impact, sans-serif; overflow:hidden; transition:transform .2s; }
  .av img { width:32px; height:32px; object-fit:contain; }
  .nm { font:400 18px/1.15 'Archivo Black', Impact, sans-serif; }
  .tag { display:inline-block; margin-left:8px; padding:1px 7px; background:var(--mark); color:#14110F; border:2px solid var(--line); border-radius:6px; font:700 11px 'Space Mono', monospace; text-transform:uppercase; vertical-align:2px; transform:rotate(-3deg); }
  .tag.paid { background:#FF8A8A; }
  .cn { display:block; margin-top:2px; font:700 11px 'Space Mono', monospace; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .ds { flex:1; margin:0; opacity:.85; }
  .go { align-self:flex-start; padding:8px 14px; background:var(--c); color:#14110F; border:2.5px solid var(--line); border-radius:10px; box-shadow:3px 3px 0 var(--shadow); font-weight:700; text-decoration:none; transition:transform .12s, box-shadow .12s; }
  .go:hover { transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--shadow); }
  .go:active { transform:translate(3px,3px); box-shadow:none; }
  .grid.compact { grid-template-columns:1fr; gap:14px; }
  .compact .card { flex-direction:row; align-items:center; justify-content:space-between; padding:12px 16px; }
  .compact .head { flex:1; }
  .compact .ds { display:none; }
  .compact .go { white-space:nowrap; }
  .empty { grid-column:1 / -1; padding:28px 0; color:var(--muted); font-weight:500; }
  footer { padding:26px 0 50px; font:700 12px 'Space Mono', monospace; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }

  @keyframes rise { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
  @keyframes slide { to { transform:translateX(-50%); } }
  @keyframes wiggle { 0%,100% { transform:rotate(-4deg); } 50% { transform:rotate(3deg); } }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <span class="logo"><i></i>AI Tools Directory</span>
  <button class="setbtn" id="setBtn" aria-expanded="false">&#9881; Settings</button>
  <div class="panel" id="panel" hidden>
    <label><input type="checkbox" id="optDark"> Dark mode</label>
    <label><input type="checkbox" id="optFree"> Show only free tools</label>
    <label><input type="checkbox" id="optCompact"> Compact list</label>
  </div>
</div></header>

<div class="ticker" aria-hidden="true"><div class="track" id="track"></div></div>

<section class="hero">
  <div class="wrap hero-in">
    <span class="sticker" id="sticker"></span>
    <h1>Find the <mark>right AI tool</mark> for the job.</h1>
    <p class="lead">Hand-picked tools for studying, writing, design, video, careers and coding. Free options are marked, so you know before you click.</p>
    <div class="sbox">
      <input id="search" type="search" placeholder="Type a tool name or what you want to do" aria-label="Search tools" autocomplete="off">
      <ul class="sug" id="sug" hidden></ul>
    </div>
    <div class="tasks">
      <button data-q="essay">Write an essay</button>
      <button data-q="math">Solve a math problem</button>
      <button data-q="background">Remove a background</button>
      <button data-q="resume">Build a resume</button>
    </div>
  </div>
</section>

<main class="wrap">
  <div class="filters" id="filters"></div>
  <p class="count" id="count"></p>
  <ul class="grid" id="list"></ul>
</main>

<footer class="wrap">Prices and limits change often. Check each tool's own site for current details.</footer>

<script>
// To add a tool, copy one line below and change the details. Keep the comma at the end.
// A new category shows up as a filter button on its own. The logo comes from the tool's link.
var tools = [
  { name:"ChatGPT", cat:"Writing", free:true, link:"https://chatgpt.com", desc:"Ask questions, draft essays and get unstuck on homework. The free plan has daily limits." },
  { name:"Gemini", cat:"Writing", free:true, link:"https://gemini.google.com", desc:"Google's assistant for brainstorming, summaries and study help." },
  { name:"QuillBot", cat:"Writing", free:true, link:"https://quillbot.com", desc:"Rewrites and paraphrases sentences. The free plan limits how many words you can use." },
  { name:"Grammarly", cat:"Writing", free:true, link:"https://www.grammarly.com", desc:"Checks grammar and spelling as you write. The free plan covers the basics." },
  { name:"DeepL", cat:"Writing", free:true, link:"https://www.deepl.com", desc:"Translates text between languages with natural phrasing. The free version has a character limit." },
  { name:"Perplexity", cat:"Study", free:true, link:"https://www.perplexity.ai", desc:"Answers questions and shows the sources behind each answer." },
  { name:"Photomath", cat:"Study", free:true, link:"https://photomath.com", desc:"Scan a math problem with your camera and see the steps to solve it." },
  { name:"NotebookLM", cat:"Study", free:true, link:"https://notebooklm.google.com", desc:"Upload notes or PDFs, then ask questions and get summaries from them." },
  { name:"Canva", cat:"Design", free:true, link:"https://www.canva.com", desc:"Make posters, thumbnails and social posts from templates. The free plan is enough to start." },
  { name:"Remove.bg", cat:"Design", free:true, link:"https://www.remove.bg", desc:"Remove the background from a photo in one tap. Free downloads are low resolution." },
  { name:"Leonardo AI", cat:"Design", free:true, link:"https://leonardo.ai", desc:"Turn a text description into an image. The free plan gives limited daily credits." },
  { name:"CapCut", cat:"Video", free:true, link:"https://www.capcut.com", desc:"Edit reels and short videos on phone or computer. Some effects need a paid plan." },
  { name:"Microsoft Copilot", cat:"Productivity", free:true, link:"https://copilot.microsoft.com", desc:"A free assistant for questions, summaries and drafting emails or notes." },
  { name:"Otter.ai", cat:"Productivity", free:true, link:"https://otter.ai", desc:"Turns meetings and lectures into written notes. The free plan has monthly limits." },
  { name:"Gamma", cat:"Productivity", free:true, link:"https://gamma.app", desc:"Builds presentations from a short prompt. The free plan gives a limited number of credits." },
  { name:"Teal", cat:"Career", free:true, link:"https://www.tealhq.com", desc:"Build a resume and keep track of the jobs you apply for. The basic tools are free." },
  { name:"Jobscan", cat:"Career", free:true, link:"https://www.jobscan.co", desc:"Compare your resume with a job post to see what is missing. The free plan has a few scans." },
  { name:"Interview Warmup", cat:"Career", free:true, link:"https://grow.google/certificates/interview-warmup/", desc:"Practice answering common interview questions out loud and review your answers. Made by Google." },
  { name:"GitHub Copilot", cat:"Coding", free:true, link:"https://github.com/features/copilot", desc:"Suggests code as you type inside your editor. There is a free plan with monthly limits." },
  { name:"Replit", cat:"Coding", free:true, link:"https://replit.com", desc:"Write and run code in your browser with AI help. The free plan has usage limits." },
  { name:"Google AI Studio", cat:"Coding", free:true, link:"https://aistudio.google.com", desc:"Try Google's AI models and test prompts you can use in your own projects." }
];

var palette = { Writing:"#3DDC97", Study:"#5AA9FF", Design:"#FF6FB5", Video:"#FF9F43", Productivity:"#36D1DC", Career:"#FFD93D", Coding:"#B388FF" };
var cats = ["All"];
tools.forEach(function (t) { if (cats.indexOf(t.cat) === -1) cats.push(t.cat); });

function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

var cat = "All", onlyFree = load("free") === "1", compact = load("compact") === "1";
var search = document.getElementById("search");
var sug = document.getElementById("sug");
var list = document.getElementById("list");
var root = document.documentElement;

function colorOf(c) { return palette[c] || "#3DDC97"; }
function tint(h, a) { var n = parseInt(h.slice(1), 16); return "rgba(" + (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + a + ")"; }
function host(link) { try { return new URL(link).hostname; } catch (e) { return ""; } }
function norm(s) { return s.toLowerCase().replace(/[^a-z0-9]/g, ""); }
function matches(t, q) {
  if (!q) return true;
  var n = norm(q);
  return (n && norm(t.name).indexOf(n) !== -1) || (t.name + " " + t.desc + " " + t.cat).toLowerCase().indexOf(q) !== -1;
}
function favicon(link) { return "https://www.google.com/s2/favicons?domain=" + host(link) + "&sz=128"; }

/* ticker and sticker */
document.getElementById("sticker").textContent = tools.length + " tools \u00b7 free ones marked";
var seq = cats.slice(1).join(" \u2726 ") + " \u2726 ", half = seq.repeat(6);
document.getElementById("track").innerHTML = "<span>" + half + "</span><span>" + half + "</span>";

/* settings */
var panel = document.getElementById("panel"), setBtn = document.getElementById("setBtn");
var optDark = document.getElementById("optDark"), optFree = document.getElementById("optFree"), optCompact = document.getElementById("optCompact");
function syncOptions() {
  optDark.checked = root.getAttribute("data-theme") === "dark";
  optFree.checked = onlyFree;
  optCompact.checked = compact;
  list.classList.toggle("compact", compact);
}
setBtn.onclick = function () { panel.hidden = !panel.hidden; setBtn.setAttribute("aria-expanded", String(!panel.hidden)); };
optDark.onchange = function () { var t = optDark.checked ? "dark" : "light"; root.setAttribute("data-theme", t); save("theme", t); };
optFree.onchange = function () { onlyFree = optFree.checked; save("free", onlyFree ? "1" : "0"); drawFilters(); render(); };
optCompact.onchange = function () { compact = optCompact.checked; save("compact", compact ? "1" : "0"); syncOptions(); };
document.addEventListener("click", function (e) {
  if (!e.target.closest(".sbox")) sug.hidden = true;
  if (!e.target.closest(".top .wrap")) panel.hidden = true;
});

/* filters */
function drawFilters() {
  var html = cats.map(function (c) {
    return '<button class="cat" style="--c:' + (c === "All" ? "#3DDC97" : colorOf(c)) + '" data-cat="' + c + '" aria-pressed="' + (c === cat) + '"><i></i>' + c + '</button>';
  }).join("");
  html += '<button class="cat free" id="freeBtn" aria-pressed="' + onlyFree + '"><i></i>Free only</button>';
  document.getElementById("filters").innerHTML = html;
  document.querySelectorAll("[data-cat]").forEach(function (b) {
    b.onclick = function () { cat = b.dataset.cat; drawFilters(); render(); };
  });
  document.getElementById("freeBtn").onclick = function () { onlyFree = !onlyFree; save("free", onlyFree ? "1" : "0"); syncOptions(); drawFilters(); render(); };
}

/* cards */
function letterBadge(av) { av.style.background = av.dataset.color; av.textContent = av.dataset.letter; }
function render() {
  var q = search.value.toLowerCase().trim();
  var out = tools.filter(function (t) {
    return (cat === "All" || t.cat === cat) && (!onlyFree || t.free) && matches(t, q);
  });
  document.getElementById("count").textContent = out.length + (out.length === 1 ? " tool" : " tools");
  list.innerHTML = out.length ? out.map(function (t, i) {
    var c = colorOf(t.cat);
    return '<li class="card" style="--c:' + c + ';--t:' + tint(c, 0.2) + ';--i:' + Math.min(i, 10) + '">' +
      '<div class="head"><div class="av" data-color="' + c + '" data-letter="' + t.name[0] + '">' +
        '<img src="' + favicon(t.link) + '" alt="" loading="lazy"></div>' +
      '<div><span class="nm">' + t.name + '</span><span class="tag' + (t.free ? '' : ' paid') + '">' + (t.free ? 'Free' : 'Paid') + '</span>' +
        '<span class="cn">' + t.cat + '</span></div></div>' +
      '<p class="ds">' + t.desc + '</p>' +
      '<a class="go" href="' + t.link + '" target="_blank" rel="noopener">Open ' + t.name + ' &rarr;</a></li>';
  }).join("") : '<li class="empty">No tools match. Try a different word or clear the filters.</li>';
  document.querySelectorAll(".av img").forEach(function (img) {
    img.onerror = fun
